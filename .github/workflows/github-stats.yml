
name: Generate GitHub Contribution Stats

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          from datetime import date, timedelta

          username = "VinuthnaReddy07"
          token = os.environ["GH_TOKEN"]

          today = date.today()
          start = today - timedelta(days=364)

          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                      color
                    }
                  }
                }
              }
            }
          }
          """

          payload = {
              "query": query,
              "variables": {
                  "login": username,
                  "from": start.isoformat() + "T00:00:00Z",
                  "to": today.isoformat() + "T23:59:59Z"
              }
          }

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              }
          )

          with urllib.request.urlopen(request) as response:
              result = json.loads(response.read())

          if "errors" in result:
              raise RuntimeError(result["errors"])

          calendar = result["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          weeks = calendar["weeks"]
          days = [
              day
              for week in weeks
              for day in week["contributionDays"]
          ]

          total = calendar["totalContributions"]

          streak = 0
          longest = 0
          current = 0

          for day in days:
              if day["contributionCount"] > 0:
                  current += 1
                  longest = max(longest, current)
              else:
                  current = 0

          # Current streak: count backward from today.
          for day in reversed(days):
              if day["contributionCount"] > 0:
                  streak += 1
              else:
                  break

          # If there was no contribution today, allow yesterday
          # to be the end of the current streak.
          if days and days[-1]["contributionCount"] == 0:
              streak = 0
              for day in reversed(days[:-1]):
                  if day["contributionCount"] > 0:
                      streak += 1
                  else:
                      break

          os.makedirs("assets", exist_ok=True)

          svg = [
              '<svg xmlns="http://www.w3.org/2000/svg" width="900" height="165" viewBox="0 0 900 165">',
              '<rect width="900" height="165" rx="12" fill="#100914"/>',
              '<text x="25" y="30" fill="#F9A8D4" font-family="Arial" font-size="16" font-weight="bold">GITHUB CONTRIBUTION ACTIVITY</text>'
          ]

          stats = [
              ("TOTAL CONTRIBUTIONS", str(total)),
              ("CURRENT STREAK", f"{streak} days"),
              ("LONGEST STREAK", f"{longest} days")
          ]

          positions = [25, 325, 625]

          for (label, value), x in zip(stats, positions):
              svg.append(
                  f'<text x="{x}" y="78" fill="#D946EF" font-family="Arial" font-size="30" font-weight="bold">{value}</text>'
              )
              svg.append(
                  f'<text x="{x}" y="105" fill="#D8B4E2" font-family="Arial" font-size="12">{label}</text>'
              )

          svg.append(
              '<text x="25" y="143" fill="#A78BFA" font-family="Arial" font-size="11">Updated automatically by GitHub Actions</text>'
          )
          svg.append('</svg>')

          with open("assets/contribution-stats.svg", "w", encoding="utf-8") as file:
              file.write("\n".join(svg))

          print(f"Total contributions: {total}")
          print(f"Current streak: {streak}")
          print(f"Longest streak: {longest}")
          PY

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-stats.svg
          git diff --cached --quiet || (
            git commit -m "Update GitHub contribution stats"
            git push
          )
